---
layout: default
---
{% if page.toc %}<nav class="toc" aria-label="Contents"><h2>Contents</h2><ol></ol></nav>{% endif %}
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  <p class="date">{{ page.date | date: "%B %Y" }}</p>
  {{ content }}
</article>
